<header class="shadow-md p-3 w-full max-h-20 fixed top-0 z-50 bg-white">
    <div class="flex align-middle items-center justify-between max-w-screen-2xl mx-auto">
        <img routerLink="/" src="./images/logo.png" alt="app logo" class="max-h-16">
        <nav class="flex gap-3 my-2 uppercase text-2xl">
            <a routerLink="/" routerLinkActive="active"
            [routerLinkActiveOptions]="{exact:true}"
            >Home</a>
            <a routerLink="/shop" routerLinkActive="active" >Shop</a>
            <a routerLink="/test-error" routerLinkActive="active">Errors</a>
        </nav>

        <div class="flex gap-3 align-middle">
            <a routerLink="cart" routerLinkActive="active" 
            matBadge="{{cartService.itemCount()}}"
             matBadgeSize="large" class="custom-badge mt-2 mr-2"
             >
                <mat-icon>shopping_cart</mat-icon>
            </a>
            @if (accountService.currentUser()) {
                <button mat-stroked-button [matMenuTriggerFor]="menu" >
                    <mat-icon>arrow_drop_down</mat-icon>
                    <span>{{accountService.currentUser()?.email}}</span>
                </button>
            }
            @else {
                <button mat-stroked-button routerLink="/account/login">login</button>
                <button mat-stroked-button routerLink="/account/register">Register</button>
            }
        </div>

    </div>
</header>

@if(busyService.loading){
    <mat-progress-bar mode="indeterminate" class="fixed top-20"></mat-progress-bar>
}

<mat-menu #menu="matMenu" class="px-5">
    <button class="px-3" mat-menu-item routerLink="/cart">
        <mat-icon>shopping_cart</mat-icon>
        My cart
    </button>

    <button class="px-3" mat-menu-item routerLink="/orders">
        <mat-icon>history</mat-icon>
        My orders
    </button>

    <mat-divider></mat-divider>

    <button class="px-3" mat-menu-item (click)="logout()" >
        <mat-icon>logout</mat-icon>
        Logout
    </button>
</mat-menu>
